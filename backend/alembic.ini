[alembic]
# Location of migration scripts, relative to this file
script_location = alembic

# sys.path prepend so src/ is importable from env.py
prepend_sys_path = .

# Separator for multiple version directories (not used here)
version_path_separator = os

# Placeholder URL — env.py overrides this at runtime with settings.DATABASE_URL_SYNC
sqlalchemy.url = postgresql+psycopg2://placeholder:placeholder@localhost/placeholder

# Template used for new migrations (alembic revision)
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Leave empty — no post-write hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
