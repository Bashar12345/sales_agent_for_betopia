global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "sales_agent_app"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    # redis_exporter sidecar required in production; basic ping check here

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    # postgres_exporter sidecar required in production
