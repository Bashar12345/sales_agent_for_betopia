# ─────────────────────────────────────────────────────────────────────────────
# Nginx — VM3 internal file/storage proxy
# Roles:
#   1. Reverse-proxy MinIO S3 API on :9000 → expose on :80 for app tier
#   2. Cache presigned URL file responses (Nginx proxy_cache)
#   3. Serve a /health endpoint for Docker healthcheck
#
# Not internet-facing. Accessible only from VM1/VM2 via private IP.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time us="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Uploads — match MinIO's 5 GB object size limit ───────────────────────
    client_max_body_size 500m;
    client_body_buffer_size 16k;

    # ── Proxy cache (for presigned download URLs) ─────────────────────────────
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=minio_cache:10m
        max_size=10g
        inactive=60m
        use_temp_path=off;

    proxy_cache_valid 200 30m;
    proxy_cache_valid 404 1m;

    # ── Upstream: MinIO ───────────────────────────────────────────────────────
    upstream minio_backend {
        server minio:9000;
        keepalive 32;
    }

    # ── Server: MinIO proxy ───────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Health check endpoint ─────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-vm3"}';
            add_header Content-Type application/json;
        }

        # ── MinIO S3 API proxy ────────────────────────────────────────────────
        # Internal VMs call http://VM3_INTERNAL_IP/minio/... to reach the S3 API.
        # Pre-signed URLs work transparently through this proxy.
        location /minio/ {
            proxy_pass         http://minio_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache GET requests for generated documents (30 min)
            proxy_cache        minio_cache;
            proxy_cache_key    "$request_method$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $http_cache_control;
            add_header         X-Cache-Status $upstream_cache_status;

            # Timeouts for large file downloads
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Don't buffer large downloads in Nginx memory
            proxy_buffering       off;
        }

        # ── Direct bucket access (proposals/quotations download) ─────────────
        # Clients request: http://VM3_IP/proposals/filename.pdf
        # Nginx rewrites to MinIO bucket path
        location ~ ^/(proposals|quotations|requirements)/(.*)$ {
            set $bucket  $1;
            set $object  $2;
            proxy_pass         http://minio_backend/$bucket/$object;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;

            # Cache downloaded documents
            proxy_cache        minio_cache;
            proxy_cache_valid  200 60m;
            add_header         X-Cache-Status $upstream_cache_status;
            proxy_buffering    off;

            # Content-Disposition for browser downloads
            add_header Content-Disposition 'attachment';
        }

        # ── Deny everything else ──────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
