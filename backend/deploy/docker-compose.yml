# =============================================================================
# Sales Intelligence Agent v3.0 — Local development stack
# Owner: Zohra (Data Foundation)
#
# Starts: PostgreSQL 17, Redis 7.4, Qdrant 1.13, NATS JetStream 2.10, MinIO
#
# Usage:
#   docker compose -f backend/deploy/docker-compose.yml up -d
#   docker compose -f backend/deploy/docker-compose.yml down -v   # wipe volumes
# =============================================================================

services:

  # ── PostgreSQL 17 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: betopia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       betopia
      POSTGRES_USER:     betopia
      POSTGRES_PASSWORD: betopia_dev
    ports:
      - "5433:5432"   # 5432 is used by the host PostgreSQL; app connects on 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betopia -d betopia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7.4 (Celery broker + result backend + cache) ───────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: betopia_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Qdrant 1.13 (vector store — 3 collections) ───────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: betopia_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── NATS JetStream 2.10 (event bus + transactional outbox relay) ─────────────
  nats:
    image: nats:2.10-alpine
    container_name: betopia_nats
    restart: unless-stopped
    command: "-js -m 8222 --store_dir /data"
    ports:
      - "4222:4222"   # client connections
      - "8222:8222"   # monitoring / HTTP
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (S3-compatible object store for PDFs / uploads) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: betopia_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  →  http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  nats_data:
  minio_data:
