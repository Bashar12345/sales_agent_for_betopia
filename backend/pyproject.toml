[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-agent-betopia"
version = "3.0.0"
description = "AI Sales Intelligence Agent for Betopia — P1 Conversation Engine, P2 Requirements Agent, P3 Data Layer"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Database — PostgreSQL 17 (async)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",          # Alembic sync driver

    # Vector DB — Qdrant 1.13+
    "qdrant-client>=1.13.0",

    # LLM providers
    "openai>=1.50.0",                  # GPT-4.1, GPT-4.1-mini, Whisper, Batch API
    "anthropic>=0.40.0",               # Claude Sonnet 4.6 with tool_use
    "tiktoken>=0.7.0",

    # Retry / resilience
    "tenacity>=8.3.0",

    # Document generation
    "python-docx>=1.1.0",             # .docx quotation export
    "reportlab>=4.2.0",               # PDF proposal generation
    "weasyprint>=62.0",               # HTML → PDF fallback

    # Multi-modal P2 document parsing
    "pdfplumber>=0.11.0",             # PDF text extraction
    "pymupdf>=1.24.0",                # PyMuPDF — PDF + image rendering
    "python-pptx>=1.0.0",             # PPTX parsing
    "openpyxl>=3.1.0",                # Excel parsing

    # Object storage — MinIO S3-compatible (VM3)
    "minio>=7.2.0",

    # File upload handling
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",

    # Background task queue (Celery + Redis broker)
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Event bus — NATS JetStream
    "nats-py>=2.9.0",

    # Observability
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",

    # Security — RS256 JWT
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",

    # HTTP client
    "httpx>=0.27.0",

    # Odoo XML-RPC (future ERP integration placeholder)
    "xmlrpc-client>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-passlib>=1.7.7",
    "types-redis>=4.6.0",
    "faker>=25.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
