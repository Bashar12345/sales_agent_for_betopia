version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# VM 3 — Data / Storage Layer
# ═══════════════════════════════════════════════════════════════════════════════
#
# Internal-only ports (firewall: allow only from VM1/VM2 private IPs):
#   :6333  — Qdrant REST+gRPC (vector DB)
#   :6334  — Qdrant gRPC
#   :9000  — MinIO S3 API     (object storage for proposals/docs)
#   :9001  — MinIO Console    (localhost-only, SSH tunnel to access)
#   :80    — Nginx            (document download proxy + MinIO presigned URL passthrough)
#
# Usage:
#   cp .env.vm3.example .env, fill in credentials
#   docker compose -f docker-compose.vm3.yml up -d
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  vm3-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

services:

  # ── Qdrant 1.13+ (Vector DB) ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: qdrant
    restart: unless-stopped
    networks:
      - vm3-internal
    ports:
      # Expose to VM1/VM2 (restrict via OS firewall to their IPs only)
      - "${QDRANT_HOST_BIND:-0.0.0.0}:6333:6333"   # HTTP REST
      - "${QDRANT_HOST_BIND:-0.0.0.0}:6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required in production}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: INFO
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
      - ./deploy/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    # Disk-heavy workload — no memory limit here; tune via OS-level limits
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── MinIO (S3-compatible object storage for proposals and quotation docs) ──
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    networks:
      - vm3-internal
    ports:
      # S3 API — accessible from VM1/VM2 (restrict via OS firewall)
      - "${MINIO_HOST_BIND:-0.0.0.0}:9000:9000"
      # Console — localhost only, SSH tunnel to manage
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_VOLUMES: /data
      # Enable Prometheus metrics endpoint
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── MinIO init — create buckets on first run ──────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - vm3-internal
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/${MINIO_BUCKET_PROPOSALS:-proposals};
        mc mb --ignore-existing local/${MINIO_BUCKET_QUOTATIONS:-quotations};
        mc mb --ignore-existing local/${MINIO_BUCKET_REQUIREMENTS:-requirements};
        mc anonymous set download local/${MINIO_BUCKET_PROPOSALS:-proposals};
        echo 'MinIO buckets initialized';
      "
    restart: "no"

  # ── Nginx (document download proxy + internal file server) ───────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-vm3
    restart: unless-stopped
    networks:
      - vm3-internal
    ports:
      # Internal-only HTTP — VM1/VM2 can request file downloads through here
      - "${NGINX_HOST_BIND:-0.0.0.0}:80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  qdrant_data:
    driver: local
  qdrant_snapshots:
    driver: local
  minio_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
